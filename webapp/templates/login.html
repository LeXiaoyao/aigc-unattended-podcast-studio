{% extends "base.html" %}
{% block title %}管理员登录 · AI观测站{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🔐</div>
      <h1 class="text-2xl font-bold text-white">管理后台</h1>
      <p class="text-gray-500 text-sm mt-1">AI观测站 · 播客调度控制台</p>
    </div>
    <form method="POST" action="/admin/login" class="bg-gray-900 rounded-2xl border border-gray-800 p-6 space-y-4">
      {% if error %}
      <div class="bg-red-900/30 border border-red-800 text-red-300 text-sm px-4 py-2 rounded-lg">{{ error }}</div>
      {% endif %}
      <div>
        <label class="block text-sm text-gray-400 mb-1">密码</label>
        <input type="password" name="password" autofocus
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/40"
          placeholder="输入管理密码">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
        登录
      </button>
    </form>
  </div>
</div>
{% endblock %}
