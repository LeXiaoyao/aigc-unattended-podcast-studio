# Codex Automation 定时任务配置模板 (每周一 09:00：新闻检索词「零和恒定」周维护)
# 部署方式：复制到 ~/.codex/automations/ai-2/automation.toml 并将 cwds 替换为你的本地仓库路径

version = 1
id = "ai-2"
kind = "cron"
name = "新闻查询词零和周维护"
status = "ACTIVE"
rrule = "DTSTART;TZID=Asia/Shanghai:20260706T090000\nRRULE:FREQ=WEEKLY;BYDAY=MO"
model = "gpt-5.4"
reasoning_effort = "medium"
execution_environment = "local"
cwds = ["/path/to/aigc-unattended-podcast-studio"]

prompt = """
你是新闻抓取管线的查询词维护员。每周执行一次查询词维护，请读取本仓库下的 `prompts/query_zero_sum_maintenance_prompt.md` 并严格执行：
1. 联网检索过去 30 天新出现的重点 AI/科技实体（大模型发布、>=5000万美元融资、具身智能/自动驾驶/AI芯片新玩家）。
2. 在保持 `news_pipeline_rules.json` 查询模板总数「零和恒定」（Tavily <= 35、Brave <= 36、Backfill <= 42）的前提下合并或替换过时词条，确保每日 API Credits 恒定不膨胀。
3. 备份原文件、校验 JSON 条数上限，并将变更记录追加至 `logs/query_template_updates.log`。
"""
